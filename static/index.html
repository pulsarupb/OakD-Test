<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OakD Multi Depth Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:monospace;padding:20px}
.container{max-width:100%;margin:0 auto}
h1{font-size:1.2em;margin-bottom:20px;opacity:.9}
#cameras-container{display:flex;gap:20px;flex-wrap:wrap}
.cam-group{flex:1 1 400px;min-width:320px;background:#181818;border-radius:8px;padding:16px;border:1px solid #222}
.cam-group h2{font-size:1em;margin-bottom:12px;opacity:.8;padding-bottom:8px;border-bottom:1px solid #222}
.streams{display:flex;gap:12px}
.stream{flex:1}
.stream img{width:100%;border-radius:6px;border:1px solid #333;display:block}
.stream-label{margin-top:4px;font-size:.75em;opacity:.5;text-align:center}
.metrics{display:flex;gap:12px;margin-top:12px}
.metric{flex:1;background:#1a1a1a;padding:10px;border-radius:6px;text-align:center}
.metric-value{font-size:1.4em;font-weight:700}
.metric-label{font-size:.7em;opacity:.5;margin-top:2px}
.status{margin-top:16px;padding:10px 16px;border-radius:6px;font-size:.85em}
.status.ok{background:#0a2a0a;color:#4caf50;border:1px solid #2a5a2a}
.status.err{background:#2a0a0a;color:#f44336;border:1px solid #5a2a2a}
</style>
</head>
<body>
<div class="container">
<h1>OakD Multi Depth Viewer</h1>
<div id="cameras-container"></div>
<div class="status err" id="status">Disconnected</div>
</div>
<script>
const wsUrl = `ws://${location.host}/ws`
let ws
let reconnectTimer

function createCameraElement(mxid, label) {
  const container = document.getElementById('cameras-container')
  const group = document.createElement('div')
  group.className = 'cam-group'
  group.id = `cam-${mxid}`
  group.innerHTML = `
    <h2>Camera ${label}</h2>
    <div class="streams">
      <div class="stream">
        <img id="rgb-${mxid}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="RGB">
        <div class="stream-label">RGB Stream</div>
      </div>
      <div class="stream">
        <img id="depth-${mxid}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Depth">
        <div class="stream-label">Depth Heatmap</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-value" id="min-${mxid}">--</div><div class="metric-label">Min (mm)</div></div>
      <div class="metric"><div class="metric-value" id="avg-${mxid}">--</div><div class="metric-label">Avg (mm)</div></div>
      <div class="metric"><div class="metric-value" id="max-${mxid}">--</div><div class="metric-label">Max (mm)</div></div>
    </div>`
  container.appendChild(group)
}

function connect() {
  ws = new WebSocket(wsUrl)
  ws.onopen = () => {
    document.getElementById('status').textContent = 'Connected'
    document.getElementById('status').className = 'status ok'
  }
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data)
    for (const [mxid, cam] of Object.entries(data)) {
      let group = document.getElementById(`cam-${mxid}`)
      if (!group) createCameraElement(mxid, cam.label)
      const rgbEl = document.getElementById(`rgb-${mxid}`)
      if (rgbEl && cam.rgb) rgbEl.src = `data:image/jpeg;base64,${cam.rgb}`
      const depthEl = document.getElementById(`depth-${mxid}`)
      if (depthEl && cam.depth) depthEl.src = `data:image/jpeg;base64,${cam.depth}`
      if (cam.min_d !== undefined) document.getElementById(`min-${mxid}`).textContent = cam.min_d
      if (cam.avg_d !== undefined) document.getElementById(`avg-${mxid}`).textContent = cam.avg_d
      if (cam.max_d !== undefined) document.getElementById(`max-${mxid}`).textContent = cam.max_d
    }
  }
  ws.onclose = () => {
    document.getElementById('status').textContent = 'Disconnected \u2014 reconnecting...'
    document.getElementById('status').className = 'status err'
    clearTimeout(reconnectTimer)
    reconnectTimer = setTimeout(connect, 2000)
  }
}
connect()
</script>
</body>
</html>
